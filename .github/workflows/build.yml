name: Build KeyboardToolsKayoko

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装基础工具
        run: |
          brew install ldid

      - name: 安装 Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -e

          echo "===== 下载 RootHide Theos ====="

          git clone --recursive \
            https://github.com/roothide/theos.git \
            "$THEOS"

          echo "===== Theos 安装完成 ====="
          ls -la "$THEOS"

      - name: 安装 iPhoneOS 16.5 SDK
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -e

          mkdir -p "$THEOS/sdks"

          echo "===== 下载 iPhoneOS 16.5 SDK ====="

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          echo "===== 检查 SDK 文件 ====="
          ls -lh /tmp/iPhoneOS16.5.sdk.tar.xz
          file /tmp/iPhoneOS16.5.sdk.tar.xz

          echo "===== 解压 SDK ====="

          tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$THEOS/sdks"

          echo "===== SDK 安装完成 ====="
          ls -la "$THEOS/sdks"

      - name: 设置 Theos 环境
        run: |
          echo "THEOS=${{ github.workspace }}/theos" >> "$GITHUB_ENV"
          echo "${{ github.workspace }}/theos/bin" >> "$GITHUB_PATH"

      - name: 检查编译环境
        run: |
          set -e

          echo "===== THEOS ====="
          echo "$THEOS"

          echo "===== SDK ====="
          ls -la "$THEOS/sdks"

          echo "===== Makefile ====="
          ls -la Makefile

          echo "===== ldid ====="
          which ldid
          ldid -V || true

      - name: 修复维护脚本权限
        run: |
          set -e

          echo "===== 修复 DEBIAN 脚本权限 ====="

          if [ -f "layout/DEBIAN/postinst" ]; then
            chmod 755 layout/DEBIAN/postinst
          fi

          echo "===== 检查 postinst 权限 ====="
          ls -l layout/DEBIAN/postinst

      - name: 编译 RootHide DEB
        run: |
          set -e

          echo "===== 开始编译 ====="

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

      - name: 检查 DEB
        run: |
          set -e

          echo "===== packages ====="
          ls -lah packages/

          echo "===== DEB 文件 ====="

          find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -print

          echo "===== DEB 内容 ====="

          for f in packages/*.deb; do
            echo "--------------------------------"
            echo "$f"
            echo "--------------------------------"

            dpkg-deb -c "$f"
          done

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardToolsKayoko-arm64e
          path: packages/*.deb
          if-no-files-found: error
