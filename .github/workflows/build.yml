name: Build KeyboardToolsKayoko

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Theos
        uses: iossxx/theos-action@v1
        with:
          theos-dir: theos
          theos-src: https://github.com/roothide/theos
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master
          orion: false

      - name: 安装 ldid
        run: |
          brew install ldid-procursus

      - name: 检查 Theos 和 SDK
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          echo "===== THEOS ====="
          echo "$THEOS"

          echo "===== SDK ====="
          ls -la "$THEOS/sdks"

          echo "===== ldid ====="
          ldid -V || true

      - name: 编译 RootHide 包
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: 检查编译结果
        run: |
          echo "===== packages ====="
          ls -lah packages/

          echo "===== DEB ====="
          find packages -type f -name "*.deb" -print

      - name: 检查 DEB 内容
        run: |
          for f in packages/*.deb; do
            echo "===== $f ====="
            dpkg-deb -c "$f"
          done

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardToolsKayoko-arm64e
          path: packages/*.deb
          if-no-files-found: error
